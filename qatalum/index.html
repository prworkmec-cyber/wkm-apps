<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json?v=2"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"><link rel="icon" type="image/png" href="icon-192.png?v=2"><meta name="theme-color" content="#1a73e8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Production">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qatalum – Daily Production</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
  .wrap{max-width:440px;margin:auto;padding:14px}
  h1{font-size:18px;color:#1a73e8;margin:4px 0 10px}
  label{display:block;font-weight:bold;margin:12px 0 4px;font-size:15px}
  input{width:100%;box-sizing:border-box;font-size:20px;padding:10px;border:1px solid #c8c8c8;border-radius:8px;background:#fff}
  input.changed{border:2px solid #f9ab00;background:#fff8e1}
  .shift{display:flex;gap:10px}
  .shift button{flex:1;font-size:18px;padding:14px;border:2px solid #1a73e8;background:#fff;color:#1a73e8;border-radius:8px}
  .shift button.on{background:#1a73e8;color:#fff}
  h2{font-size:13px;color:#555;margin:20px 0 0;border-bottom:1px solid #ddd;padding-bottom:4px;text-transform:uppercase}
  .live{font-size:13px;color:#555;margin-top:4px;line-height:1.5}
  .live b{color:#188038}
  .live .chg{color:#b06000;font-weight:bold}
  .live .warn{color:#c5221f;font-weight:bold}
  .card{background:#fff;border-radius:10px;padding:12px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .card div{display:flex;justify-content:space-between;font-size:15px;padding:3px 0}
  .card b{font-size:17px}
  #save{width:100%;margin-top:20px;font-size:20px;padding:16px;background:#188038;color:#fff;border:0;border-radius:8px}
  #save:disabled{background:#9e9e9e}
  body{padding-bottom:84px}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #d0d7e2;box-shadow:0 -2px 8px rgba(0,0,0,.08);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
  .tabs button{flex:1;font-size:15px;line-height:1.3;padding:8px 4px;border:0;background:none;color:#5f6b7a;font-weight:bold;border-radius:10px;margin:0 4px}
  .tabs button.on{background:#e3eefd;color:#1a73e8}
  .hide{display:none}
  #msg{margin-top:14px;font-size:15px;text-align:center;white-space:pre-line}

  @media (min-width:900px){
    .wrap{max-width:980px;padding:24px 32px}
    #fields{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;column-gap:28px}
    #fields .fld.hide{display:block}               /* computer: Production and Counters both visible */
    .tabs{display:none}body{padding-bottom:0}
    #shiftBox.hide{display:block}
    #sum,#save,#msg{max-width:460px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Qatalum – Daily Production</h1>
  <div id="shiftBox"><div class="shift"><button id="Day" class="on">Day shift</button><button id="Night">Night shift</button></div></div>
  <label>Date</label>
  <input type="date" id="date">
  <div id="fields"></div>
  <div class="card" id="sum"></div>
  <button id="save">Save production + counters</button>
  <div id="msg"></div>
</div>
<nav class="tabs"><button id="tProd" class="on">🏭<br>Production</button><button id="tCtr">🔢<br>Counters</button></nav>
<script>
  // Data lives in the Google Sheet; this page talks to the Apps Script web app's JSON API.
  const API = 'https://script.google.com/macros/s/AKfycbygNAt3BORXl47Th-s4sZRiKSNW2JOc41o0_X8EKrmaKXAyeasuz9aBH6pxGldeKZtzDg/exec';
  function call(params, ok, fail) {
    fetch(API + '?' + new URLSearchParams(params).toString(), { redirect: 'follow' })
      .then(r => { if (!r.ok) throw new Error('Server error ' + r.status); return r.json(); })
      .then(j => { if (j && j.error) throw new Error(j.error); ok(j); })
      .catch(e => fail(e));
  }

  const F = [
    ['cages', 'Complete cages', 'Made this shift', 'qty'],
    ['spn', 'Spider rings – normal', '', 'qty'],
    ['spi', 'Spider rings – inverted', '', 'qty'],
    ['arms', 'Arms counter', 'Machine counter readings (once a day, same for both shifts)', 'ctr'],
    ['small', 'Small rings counter', '', 'ctr'],
    ['wire', 'Long wire counter', '', 'ctr']
  ];
  let shift = 'Day', live = null;
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const fmt = n => Number(n).toLocaleString('en-US');
  const t = new Date();
  $('date').value = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
  $('date').max = $('date').value;
  (function autoShift() {
    const h = t.getHours();
    if (h < 8) { const y = new Date(t.getTime() - 864e5); $('date').value = y.getFullYear() + '-' + pad(y.getMonth() + 1) + '-' + pad(y.getDate()); shift = 'Night'; }
    else if (h >= 20) shift = 'Night'; else shift = 'Day';
    $('Day').classList.toggle('on', shift === 'Day'); $('Night').classList.toggle('on', shift === 'Night');
  })();
  const niceDate = d => { const m = String(d).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[3]) + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2] - 1] : d; };
  function saveLabel() { $('save').textContent = 'Save ' + shift.toUpperCase() + ' shift – ' + niceDate($('date').value); }

  let h = '';
  F.forEach(f => {
    h += '<div class="fld ' + f[3] + '">' + (f[2] ? '<h2>' + f[2] + '</h2>' : '') +
         '<label>' + f[1] + '</label><input type="number" inputmode="numeric" min="0" id="f_' + f[0] + '">' +
         '<div class="live" id="l_' + f[0] + '"></div></div>';
  });
  $('fields').innerHTML = h;
  F.forEach(f => $('f_' + f[0]).oninput = calc);

  let tab = 'qty';   // 'qty' = Production tab, 'ctr' = Counters tab
  function setTab(t) {
    tab = t;
    $('tProd').classList.toggle('on', t === 'qty');
    $('tCtr').classList.toggle('on', t === 'ctr');
    document.querySelectorAll('.fld').forEach(d => d.classList.toggle('hide', !d.classList.contains(t)));
    $('shiftBox').classList.toggle('hide', t === 'ctr');
    $('sum').classList.toggle('hide', t === 'ctr');
    $('msg').textContent = '';
  }
  $('tProd').onclick = () => setTab('qty');
  $('tCtr').onclick = () => setTab('ctr');
  setTab('qty');

  const num = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
  // a counter reading of 0 means "no reading" (ignored)
  const ctr = v => { const n = num(v); return n === 0 ? null : n; };
  // made by a counter reading compared with the previous reading (reset = reading itself)
  const made = (reading, prev) => reading === null ? 0 : (prev === null || reading < prev ? reading : reading - prev);

  function calc() {
    if (!live) return;
    const after = {};
    F.forEach(f => {
      const k = f[0], el = $('f_' + k), out = $('l_' + k);
      const total = live.totals[k];
      let txt = '';
      if (f[3] === 'qty') {
        const saved = num(live.entry[k]), typed = num(el.value);
        const a = total - (saved || 0) + (typed === null ? (saved || 0) : typed);
        after[k] = a;
        txt = 'Balance now ' + fmt(total) + (typed !== null && typed !== (saved || 0) ? ' → new balance <b>' + fmt(a) + '</b>' : '') +
              (saved !== null ? '<br><span class="chg">Saved for this shift: ' + fmt(saved) + (typed !== null && typed !== saved ? ' → will be changed to ' + fmt(typed) : ' · to correct it, change the number and Save') + '</span>' : '');
      } else {
        const saved = ctr(live.entry[k]), typed = ctr(el.value), prev = ctr(live.prev[k]);
        const mSaved = made(saved, prev), mNew = typed === null ? mSaved : made(typed, prev);
        const a = total - mSaved + mNew;
        after[k] = a;
        txt = 'Previous reading: ' + (prev === null ? '—' : fmt(prev));
        if (typed !== null) txt += ' · made today <b>' + fmt(mNew) + '</b>';
        else if (num(el.value) === 0) txt += ' · <b>0 = no reading</b> (ignored)';
        txt += '<br>Balance now ' + fmt(total) + (typed !== null ? ' → new balance <b>' + fmt(a) + '</b>' : '');
        if (typed !== null && prev !== null && typed < prev)
          txt += '<br><span class="warn">Reading is lower than previous – counter reset? Counted as ' + fmt(typed) + '.</span>';
        if (saved !== null) txt += '<br><span class="chg">Reading already entered today: ' + fmt(saved) + ' (your reading replaces it)</span>';
      }
      out.innerHTML = txt;
    });
    const rem = Math.max(0, live.totals.order - after.cages);
    $('sum').innerHTML =
      '<div><span>Cages made – new balance</span><b>' + fmt(after.cages) + '</b></div>' +
      '<div><span>Order</span><span>' + fmt(live.totals.order) + '</span></div>' +
      '<div><span>Remaining</span><b>' + fmt(rem) + '</b></div>' +
      '<div><span>Complete</span><span>' + (live.totals.order ? (after.cages / live.totals.order * 100).toFixed(1) : 0) + '%</span></div>';
  }

  function fillSaved() { F.forEach(f => { const s = live.entry[f[0]]; $('f_' + f[0]).value = (s === '' || s == null || (f[3] === 'ctr' && Number(s) === 0)) ? '' : s; }); saveLabel(); }
  let req = 0;
  function load(keepMsg) {
    if (!keepMsg) $('msg').textContent = 'Loading…';
    $('save').disabled = true;
    const my = ++req;
    call({ api: 'live', date: $('date').value, shift: shift }, v => {
      if (my !== req) return;            // a newer date/shift was picked meanwhile
      live = v;
      fillSaved();
      calc();
      if (!keepMsg) $('msg').textContent = '';
      $('save').disabled = false;
    }, e => { if (my === req) $('msg').textContent = '⚠ ' + e.message; });
  }

  ['Day', 'Night'].forEach(s => $(s).onclick = () => {
    shift = s;
    $('Day').classList.toggle('on', s === 'Day');
    $('Night').classList.toggle('on', s === 'Night');
    saveLabel(); load();
  });
  $('date').onchange = () => { saveLabel(); load(); };

  $('save').onclick = () => {
    const vals = {}, lines = [];
    F.forEach(f => {
      const v = $('f_' + f[0]).value;
      if (v === '') return;
      if (f[3] === 'ctr' && Number(v) === 0) return;   // 0 counter = no reading, not sent
      const s = live && live.entry[f[0]];
      if (s !== '' && s != null && Number(s) === Number(v)) return;   // unchanged
      vals[f[0]] = v; lines.push(f[1] + ': ' + (s !== '' && s != null ? fmt(s) + ' → ' : '') + fmt(v));
    });
    if (!Object.keys(vals).length) { $('msg').textContent = 'No changes to save.'; return; }
    if (!confirm('Save ' + shift.toUpperCase() + ' shift – ' + niceDate($('date').value) + '?\n\n' + lines.join('\n'))) return;
    $('save').disabled = true;
    $('msg').textContent = 'Saving…';
    call({ api: 'add', date: $('date').value, shift: shift, vals: JSON.stringify(vals) }, r => {
      $('msg').textContent = '✓ ' + r.message;
      live = r.live;
      fillSaved();
      calc();
      $('save').disabled = false;
    }, e => { $('msg').textContent = '⚠ ' + e.message; $('save').disabled = false; });
  };
  load();
</script>
</body>
</html>
