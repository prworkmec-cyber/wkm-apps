<link rel="manifest" href="manifest.json?v=2"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"><link rel="icon" type="image/png" href="icon-192.png?v=2"><meta name="theme-color" content="#b35c00"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="WKM Stock"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--acc:#b35c00;--bg:#f6f4f1;--card:#fff;--ink:#222;--mut:#777;--ok:#2e7d32;--bad:#c62828}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}
select,input[type=date],input[type=text]{width:100%;font-size:16px;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff}
input[type=password],input[type=tel]{width:100%;font-size:20px;padding:10px;border:1px solid #ccc;border-radius:8px;letter-spacing:4px}
.pick{display:block;width:100%;padding:16px;border:2px dashed var(--acc);border-radius:10px;text-align:center;color:var(--acc);font-weight:bold;font-size:16px;cursor:pointer}

button:disabled{opacity:.5}
.msg{padding:10px;border-radius:8px;font-size:14px;margin-top:10px}.err{background:#fdecea;color:var(--bad)}.wait{background:#fff4e5;color:#8a4a00}
.grp{font-weight:bold;color:#8a4a00;background:#fdf1e3;padding:8px 10px;border-radius:8px;margin:14px 0 6px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
th{font-size:12px;color:var(--mut);text-align:left;padding:8px;border-bottom:1px solid #eee}
td{padding:9px 8px;border-bottom:1px solid #f1f1f1;font-size:16px;vertical-align:top}

.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;margin-top:3px}
.posted{background:#e8f5e9;color:var(--ok)}.new{background:#fff4e5;color:#8a4a00}
.warn{color:var(--bad);font-size:12px}.nm{font-size:11px;color:var(--mut)}
.good{color:var(--ok)}.bad{color:var(--bad)}.sm{font-size:11px;font-weight:bold}
.two{display:flex;gap:6px;margin-bottom:6px}.two input{flex:1;min-width:0}
.cal .calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal button{width:auto;margin:0;padding:0;border-radius:8px;font-weight:normal}
.cal .calh button{background:#f1e6da;color:var(--acc);font-size:20px;width:44px;height:36px;font-weight:bold}

.cal .cw{font-size:11px;color:var(--mut);padding:2px 0}

.cal .cd.on{background:var(--acc);color:#fff;font-weight:bold}
.cal .cd.ph:after{content:'';position:absolute;bottom:4px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:#2e7d32}
.cal .cd.on.ph:after{background:#fff}
.cal .cd:disabled{opacity:.3}
.hide{display:none!important}
body{padding-bottom:84px}
.btabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #e3d8cc;box-shadow:0 -2px 8px rgba(0,0,0,.08);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.btabs button{flex:1;width:auto;margin:0 4px;padding:8px 4px;font-size:15px;line-height:1.3;background:none;color:#7a6a5a;border-radius:10px}
.btabs button.on{background:#f6e7d6;color:var(--acc)}
.invtop{display:flex;gap:8px}.invtop input{flex:1;min-width:0;width:auto;font-size:16px;padding:10px;border:1px solid #ccc;border-radius:8px}
.invtop button{width:48px;margin:0;padding:0;font-size:22px}
.chips{display:flex;gap:6px;margin-top:10px}.chips button{width:auto;flex:1;margin:0;padding:8px 4px;font-size:14px;background:#f1e6da;color:var(--acc)}
.chips button.on{background:var(--acc);color:#fff}
.it{display:flex;gap:12px;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.it .ph{width:84px;height:84px;flex:0 0 84px;border-radius:8px;background:#f1ece6 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#b9a99a;font-size:11px;overflow:hidden}
.it .ph img{width:100%;height:100%;object-fit:cover}
.it .bd{flex:1;min-width:0}
.it .cd1{font-weight:bold;font-size:16px}.it .nmz{font-size:14px;margin-top:2px}.it .art{font-family:monospace;font-size:12px;color:#555;margin-top:3px;word-break:break-all}
.it .stk{margin-top:6px;font-size:15px}.it .stk b{font-size:17px}.it .zero{color:var(--bad);font-weight:bold}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#zoom img{max-width:100%;max-height:80vh;border-radius:8px;background:#fff}#zcap{color:#fff;margin-top:10px;text-align:center;font-size:15px}
</style></head><body><div class="wrap">
<h1>WKM Stock Check</h1><div class="sub">Upload the daily stock sheet photo, check the balance left for each item, then post the new entries.</div>
<div class="card"><label>PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="Enter PIN"></div>
<div id="vCheck"><div class="card"><label>Project / order</label><select id="ord"><option value="">Enter the PIN to load orders…</option></select></div>
<div class="card"><label>Entry dates <span class="nm">(tap one or more days)</span></label><input id="dt" type="hidden"><div id="cal" class="cal"></div><div id="dsel" class="nm" style="margin-top:8px"></div></div>
<div class="card"><label class="pick">📷 Take / upload photo<input id="file" type="file" accept="image/*"></label><div id="fn" class="fn"></div>
<button id="go" onclick="go()">Check balances</button><div id="st"></div></div>
<div id="out"></div></div>
<div id="vInv" class="hide">
 <div class="card"><div class="invtop"><input id="iq" type="search" placeholder="Search code, name or article" oninput="drawInv()"><button type="button" id="irf" onclick="loadInv(true)">↻</button></div>
  <div class="chips"><button type="button" data-f="all" class="on" onclick="invFilter(this)">All</button><button type="button" data-f="in" onclick="invFilter(this)">In stock</button><button type="button" data-f="zero" onclick="invFilter(this)">Zero stock</button></div>
  <div id="ist" class="nm" style="margin-top:8px">Enter the PIN above to see the inventory.</div></div>
 <div id="ilist"></div>
</div></div>
<nav class="btabs"><button type="button" id="tChk" class="on" onclick="setView('chk')">📷<br>Daily check</button><button type="button" id="tInv" onclick="setView('inv')">📦<br>Inventory</button></nav>
<div id="zoom" class="hide" onclick="this.classList.add('hide')"><img id="zimg" alt=""><div id="zcap"></div></div>
<script>
/* Adapter: this page is hosted on GitHub Pages and talks to the WKM Stock Check Apps Script
   backend (JSON API, doPost) in the background - no Google sign-in involved. The PIN, the AI key
   and all data stay in the Apps Script project; nothing secret is in this file. */
var WKM_API='https://script.google.com/macros/s/AKfycbyVPC3VXQXhbW89bu8CsoX6TVLsGlfdFsb6hiDBAkdbwfJMY3l52yVDEpwOTBoTWqYB/exec';
function wkmCall(action,args,ok,fail){var b={action:action};
 if(action==='orders'){b.pin=args[0];}
 else if(action==='check'){b.pin=args[0];b.b64=args[1];b.mime=args[2];b.order=args[3];}
 else if(action==='post'){b.pin=args[0];b.rows=args[1];b.name=args[2];b.order=args[3];}
 fetch(WKM_API,{method:'POST',body:JSON.stringify(b),redirect:'follow'})
  .then(function(r){if(!r.ok)throw new Error('Server error '+r.status);return r.json();})
  .then(function(j){if(ok)ok(j);})
  .catch(function(e){if(fail)fail(e);});}
function wkmRunner(){var ok=null,fail=null,api={
 withSuccessHandler:function(f){ok=f;return api;},
 withFailureHandler:function(f){fail=f;return api;},
 stockOrders:function(){wkmCall('orders',arguments,ok,fail);},
 stockCheck:function(){wkmCall('check',arguments,ok,fail);},
 stockPost:function(){wkmCall('post',arguments,ok,fail);}};return api;}
var google={script:{}};Object.defineProperty(google.script,'run',{get:wkmRunner});
</script>
<script>
try{localStorage.removeItem('wkmpin');}catch(e){}   // PIN is never stored on the phone (old saved PINs are wiped)
setTimeout(function(){if(typeof loadOrders==='function')loadOrders();},0);
var ORDLOADED='';
function loadOrders(){var pin=document.getElementById('pin').value.trim();if(pin.length<4||pin===ORDLOADED)return;ORDLOADED=pin;var s=document.getElementById('ord');s.innerHTML='<option value="">Loading orders…</option>';
 google.script.run.withSuccessHandler(function(r){if(!r||r.error){ORDLOADED='';s.innerHTML='<option value="">'+esc((r&&r.error)||'Could not load orders')+'</option>';return;}
  var o='<option value="">(no order)</option>',g=null;(r.orders||[]).forEach(function(x){if(x.group!==g){if(g!==null)o+='</optgroup>';g=x.group;o+='<optgroup label="'+esc(g)+'">';}o+='<option value="'+esc(x.orderNo)+'">'+esc(x.orderNo)+(x.project?' – '+esc(x.project):'')+'</option>';});if(g!==null)o+='</optgroup>';s.innerHTML=o;
  try{var so=localStorage.getItem('wkmord');if(so&&[].some.call(s.options,function(op){return op.value===so;}))s.value=so;else if(r.orders&&r.orders.length===1)s.value=r.orders[0].orderNo;}catch(e){}})
 .withFailureHandler(function(){ORDLOADED='';s.innerHTML='<option value="">Could not load orders</option>';}).stockOrders(pin);}
document.getElementById('pin').addEventListener('input',loadOrders);document.getElementById('pin').addEventListener('change',loadOrders);
document.getElementById('ord').onchange=function(){try{localStorage.setItem('wkmord',this.value);}catch(e){}};
(function(){var d=new Date();document.getElementById('dt').value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);drawCal();if(pendingJob())msg('A photo check was not finished. Enter the PIN and tap <b>Check balances</b> to get its result (no need to pick the photo again).','wait');})();
document.getElementById('dt').onchange=function(){if(window.LASTROWS)show(window.LASTROWS);};
document.getElementById('file').onchange=function(){var f=this.files[0];document.getElementById('fn').textContent=f?f.name:'';};
function msg(t,c){document.getElementById('st').innerHTML=t?'<div class="msg '+c+'">'+t+'</div>':'';}
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
function nice(d){var m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return d||'No date';return +m[3]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]+' '+m[1];}
function shrink(file,cb){var img=new Image(),url=URL.createObjectURL(file);img.onload=function(){var max=2000,w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',0.88).split(',')[1]);};img.onerror=function(){cb(null);};img.src=url;}
function go(){var pin=document.getElementById('pin').value.trim(),f=document.getElementById('file').files[0];
 if(!pin){msg('Enter the PIN.','err');return;}
 if(!f){var pj=pendingJob();if(pj){document.getElementById('go').disabled=true;msg('Getting the result of the unfinished check…','wait');JOB={id:pj.id,b64:pj.b64,order:pj.order,pin:pin,started:Date.now(),tries:0,done:false};sendJob();return;}
  msg('Choose a photo first.','err');return;}
 var b=document.getElementById('go');b.disabled=true;document.getElementById('out').innerHTML='';msg('Reading the sheet… this takes about 20–40 seconds. You can leave the app – the reading carries on and the result is waiting when you come back.','wait');
 shrink(f,function(b64){ if(!b64){b.disabled=false;msg('Could not open that photo.','err');return;}
  runCheck(pin,b64,document.getElementById('ord').value);});}
/* A check is a "job": the server keeps reading even if the phone leaves the page, and remembers the
   result for 6 hours. If the connection drops, the page simply asks again with the same job id. */
var JOB;
function pendingJob(){try{var p=JSON.parse(localStorage.getItem('wkmjob')||'null');if(p&&Date.now()-p.t<6*3600e3)return p;}catch(e){}return null;}
function saveJob(){try{if(JOB&&!JOB.done)localStorage.setItem('wkmjob',JSON.stringify({id:JOB.id,b64:JOB.b64,order:JOB.order,t:Date.now()}));else localStorage.removeItem('wkmjob');}catch(e){}}
function runCheck(pin,b64,order){JOB={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),b64:b64,order:order,pin:pin,started:Date.now(),tries:0,done:false};saveJob();sendJob();}
function finishJob(j){j.done=true;saveJob();document.getElementById('go').disabled=false;}
function sendJob(){var j=JOB;if(!j||j.done)return;j.tries++;
 fetch(WKM_API,{method:'POST',body:JSON.stringify({action:'check',pin:j.pin,b64:j.b64,mime:'image/jpeg',order:j.order,job:j.id}),redirect:'follow'})
 .then(function(r){if(!r.ok)throw new Error('Server error '+r.status);return r.json();})
 .then(function(r){if(j.done||JOB!==j)return;
   if(r&&r.retry){setTimeout(sendJob,1500);return;}
   finishJob(j);
   if(!r||r.error){msg(esc((r&&r.error)||'Something went wrong.'),'err');return;}
   msg('','');show(r.rows||[]);})
 .catch(function(e){if(j.done||JOB!==j)return;
   if(document.hidden)return;                       // phone is on the home screen: ask again when the app is opened
   if(j.tries<8){msg('Connection dropped – reconnecting… (the sheet is still being read)','wait');setTimeout(sendJob,2500);}
   else{finishJob(j);msg('Could not reach the server ('+esc(e.message||e)+'). Tap Check balances to try again – the photo is kept.','err');try{localStorage.setItem('wkmjob',JSON.stringify({id:j.id,b64:j.b64,order:j.order,t:Date.now()}));}catch(x){}}});}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&JOB&&!JOB.done&&Date.now()-JOB.started>2000){msg('Welcome back – collecting the result…','wait');sendJob();}});
/* multi-date calendar */
var CALM;   /* shown month [year, month]; declared without a value so an early drawCal() call is safe */
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function selDates(){var v=document.getElementById('dt').value;return v?v.split(','):[];}
function setDates(a){a=a.slice().sort();document.getElementById('dt').value=a.join(',');drawCal();if(window.LASTROWS)show(window.LASTROWS);}
function calTog(k){var a=selDates(),i=a.indexOf(k);if(i<0)a.push(k);else a.splice(i,1);setDates(a);}
function calMove(n){CALM[1]+=n;if(CALM[1]<0){CALM[1]=11;CALM[0]--;}if(CALM[1]>11){CALM[1]=0;CALM[0]++;}drawCal();}
function drawCal(){var sel=selDates(),ph=[],today=ymd(new Date());(window.LASTROWS||[]).forEach(function(r){if(r.date&&ph.indexOf(r.date)<0)ph.push(r.date);});
 if(!CALM){var b=sel[sel.length-1]||today;CALM=[+b.slice(0,4),+b.slice(5,7)-1];}
 var y=CALM[0],m=CALM[1],start=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
 var h='<div class="calh"><button type="button" onclick="calMove(-1)">‹</button><b>'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]+' '+y+'</b><button type="button" onclick="calMove(1)">›</button></div><div class="calg">';
 ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(function(d){h+='<span class="cw">'+d+'</span>';});
 for(var i=0;i<start;i++)h+='<span></span>';
 for(var d=1;d<=days;d++){var k=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+d).slice(-2);
  h+='<button type="button" class="cd'+(sel.indexOf(k)>=0?' on':'')+(ph.indexOf(k)>=0?' ph':'')+'"'+(k>today?' disabled':'')+' onclick="calTog(\''+k+'\')">'+d+'</button>';}
 document.getElementById('cal').innerHTML=h+'</div>';
 document.getElementById('dsel').innerHTML=sel.length?'Showing: <b>'+sel.map(nice).join(', ')+'</b> · <a href="#" onclick="setDates([]);return false">show all dates</a>':'No day picked – showing <b>all dates</b> on the photo.';}
var INV=null,INVF='all',INVPIN='';
function pinH(p){var h=5381;p='wkm|'+p;for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))|0;return h;}   // saved list only shows again with the right PIN
function setView(v){document.getElementById('vCheck').classList.toggle('hide',v!=='chk');document.getElementById('vInv').classList.toggle('hide',v!=='inv');
 document.getElementById('tChk').classList.toggle('on',v==='chk');document.getElementById('tInv').classList.toggle('on',v==='inv');
 try{localStorage.setItem('wkmview',v);}catch(e){} if(v==='inv')loadInv(false);window.scrollTo(0,0);}
function loadInv(force){var pin=document.getElementById('pin').value.trim(),st=document.getElementById('ist');
 if(pin.length<4){st.innerHTML='Enter the PIN above to see the inventory.';return;}
 if(INV&&!force&&INVPIN===pin){drawInv();return;}
 if(!INV){try{var sv=JSON.parse(localStorage.getItem('wkminv')||'null');if(sv&&sv.items&&sv.p===pinH(pin)){INV=sv.items;INV.at=sv.at;drawInv();}}catch(e){}}   // show last list at once
 st.innerHTML=(INV?st.innerHTML+' · ':'')+'<b>Updating live stock…</b>';
 fetch(WKM_API,{method:'POST',body:JSON.stringify({action:'inventory',pin:pin}),redirect:'follow'}).then(function(r){if(!r.ok)throw new Error('Server error '+r.status);return r.json();})
  .then(function(j){if(!j||j.error){st.innerHTML='<span class="bad">'+esc((j&&j.error)||'Could not load')+'</span>';return;}INV=j.items||[];INVPIN=pin;INV.at=j.at;drawInv();try{localStorage.setItem('wkminv',JSON.stringify({items:INV,at:j.at,p:pinH(pin)}));}catch(e){}})
  .catch(function(e){st.innerHTML='<span class="bad">Could not load ('+esc(e.message||e)+'). Tap ↻ to try again.</span>';});}
function invFilter(b){INVF=b.dataset.f;[].forEach.call(document.querySelectorAll('.chips button'),function(x){x.classList.toggle('on',x===b);});drawInv();}
function invQty(n,u){return (Number(n)||0).toLocaleString('en-US')+' <span class="nm">'+esc(u||'')+'</span>';}
function drawInv(){if(!INV)return;var q=(document.getElementById('iq').value||'').toLowerCase().replace(/\s+/g,' ').trim();
 var list=INV.filter(function(i){var has=(Number(i.kg)||0)>0||(Number(i.nos)||0)>0;if(INVF==='in'&&!has)return false;if(INVF==='zero'&&has)return false;
  if(!q)return true;var hay=(i.code+' wkm'+i.no+' '+i.name+' '+i.size+' '+i.article+' '+i.material).toLowerCase();return q.split(' ').every(function(w){return hay.indexOf(w)>=0;});});
 document.getElementById('ist').innerHTML=list.length+' of '+INV.length+' items · live stock at '+esc(INV.at||'')+' · view only';
 var h='';list.forEach(function(i){var k=INV.indexOf(i),has=(Number(i.kg)||0)>0||(Number(i.nos)||0)>0;
  h+='<div class="it"><div class="ph"'+(i.img?' onclick="zoomInv('+k+')"':'')+'>'+(i.img?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(i.img)+'" alt="">':'no picture')+'</div><div class="bd">'
   +'<div class="cd1">'+esc(i.code)+'</div><div class="nmz">'+esc(i.name)+(i.size?' · '+esc(i.size):'')+'</div>'
   +(i.article?'<div class="art">'+esc(i.article)+(i.material?' · '+esc(i.material):'')+'</div>':'')
   +'<div class="stk">'+(has?'<b>'+invQty(i.kg,i.kgU||'KG')+'</b> &nbsp;·&nbsp; <b>'+invQty(i.nos,i.nosU||'NO')+'</b>':'<span class="zero">Out of stock</span>')+'</div></div></div>';});
 document.getElementById('ilist').innerHTML=h||'<div class="card">Nothing matches.</div>';}
function zoomInv(k){var i=INV[k];if(!i||!i.img)return;document.getElementById('zimg').src=i.img;document.getElementById('zcap').innerHTML='<b>'+esc(i.code)+'</b> · '+esc(i.name)+(i.size?' · '+esc(i.size):'')+'<br>'+esc(i.article||'');document.getElementById('zoom').classList.remove('hide');}
function fmtd(n){n=Math.round(n*100)/100;return (n>0?'+':'')+n;}
function show(all){[].forEach.call(document.querySelectorAll('.rsh'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r&&i.value){r.shift=i.value;r._shAssumed=false;}});[].forEach.call(document.querySelectorAll('.rn'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r)r.note=i.value.trim();});[].forEach.call(document.querySelectorAll('.rd'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r)r.doc=i.value.trim();});[].forEach.call(document.querySelectorAll('.rp'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r)r.party=i.value.trim();});window.LASTROWS=all;drawCal();var sel=document.getElementById('dt').value;var shf='';var rows=all.filter(function(r){if(sel&&sel.split(',').indexOf(r.date)<0)return false;if(!r.shift||r._shAssumed){r.shift=shf;r._shAssumed=true;}if(shf&&r.shift!==shf)return false;return true;});
 if(!rows.length&&all.length){var ds=[];all.forEach(function(r){if(r.date&&ds.indexOf(r.date)<0)ds.push(r.date);});document.getElementById('out').innerHTML='<div class="card">No entries for <b>'+esc(sel.split(',').map(nice).join(', '))+(shf?' · '+(shf==='N'?'Night':'Day')+' shift':'')+'</b> on this photo.'+(ds.length?'<br>Dates on the photo: '+ds.map(nice).join(', ')+'. Tap those days in the calendar to see them (green dot = on the photo).':'')+'</div>';return;}
var os=document.getElementById('ord'),ot=os&&os.value?os.options[os.selectedIndex].text:'(no order)';document.getElementById('out').innerHTML='';var pre='<div class="sub" style="margin:4px 0 0">Project: <b>'+esc(ot)+'</b></div>';
 setTimeout(function(){var o=document.getElementById('out');o.innerHTML=pre+o.innerHTML;},0);if(!rows.length){document.getElementById('out').innerHTML='<div class="card">No rows found on the photo.</div>';return;}
 var h='',g=null;rows.forEach(function(r){var k=r.date+'|'+r.shift;if(k!==g){if(g!==null)h+='</table>';g=k;h+='<div class="grp">'+nice(r.date)+' · '+(r.shift==='N'?'Night shift':r.shift==='D'?'Day shift':'Shift not read')+'</div><table><tr><th>WKM</th><th style="text-align:center">Shift</th><th style="text-align:right">+ / −</th><th style="text-align:right">Computer<br>balance</th><th style="text-align:right">Sheet<br>balance</th></tr>';}
  var cls=String(r.change).charAt(0)==='-'?'minus':'plus';
  var k=all.indexOf(r),sv=r.shift||'';h+='<tr><td><b>'+esc(r.item)+'</b><div class="nm">'+esc(r.name)+'</div></td><td style="text-align:center">'+((!r.posted&&!r.error)?'<select class="rsh" data-k="'+k+'" style="width:58px;padding:6px;font-size:15px'+(sv?'':';border:2px solid #c62828')+'"><option value=""'+(sv?'':' selected')+'>?</option><option value="D"'+(sv==='D'?' selected':'')+'>D</option><option value="N"'+(sv==='N'?' selected':'')+'>N</option></select>':'<b>'+(sv||'?')+'</b>')+'</td><td class="n '+cls+'">'+esc(String(r.change).replace('-','−'))+'</td><td class="n">';
  if(r.error){h+='<span class="warn">'+esc(r.error)+'</span></td><td></td></tr>';}
  else{var hs=!(r.sheet===null||r.sheet===undefined||r.sheet==='');
   h+='<b>'+esc(r.balance)+'</b> <span class="nm">'+(r.unit==='KG'?'kg':'pcs')+'</span><br><span class="tag '+(r.posted?'posted">posted ✓':'new">not posted yet')+'</span></td>'
    +'<td class="n">'+(!hs?'<span class="nm">—</span>':(r.mismatch?'<b class="bad">'+esc(r.sheet)+'</b><div class="bad sm">✗ wrong by '+esc(fmtd(Number(r.sheet)-Number(r.balance)))+'</div>':'<b class="good">'+esc(r.sheet)+'</b><div class="good sm">✓ correct</div>'))+'</td></tr>';}
  if(!r.posted&&!r.error&&(r.add||r.minus)){var kk=all.indexOf(r),pl=r.add?'Supplier':'Customer';
   h+='<tr><td colspan="5" style="padding-top:0"><div class="two"><input class="rd" type="text" data-k="'+kk+'" placeholder="Doc No." value="'+esc(r.doc||'')+'"><input class="rp" type="text" data-k="'+kk+'" placeholder="'+pl+'" value="'+esc(r.party||'')+'"></div>'
    +'<input class="rn" type="text" data-k="'+kk+'" placeholder="Note (optional)" value="'+esc(r.note||'')+'"></td></tr>';}});
 h+='</table>';
 var np=rows.filter(function(r){return !r.posted&&!r.error&&(r.add||r.minus);});window.TOPOST=np;
 if(np.length){var nm='';try{nm=localStorage.getItem('wkmname')||'';}catch(e){}
  h+='<div class="card" style="margin-top:12px"><label>Your name (needed to post)</label><input id="who" type="text" autocomplete="name" value="'+esc(nm)+'">'
   +'<button id="pb" onclick="post()">Post '+np.length+' new entr'+(np.length>1?'ies':'y')+' to ledger</button><div id="pst"></div></div>';}
 document.getElementById('out').innerHTML=h;}
function post(){var np=window.TOPOST||[];if(!np.length)return;[].forEach.call(document.querySelectorAll('.rsh'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r){r.shift=i.value;r._shAssumed=false;}});[].forEach.call(document.querySelectorAll('.rn'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r)r.note=i.value.trim();});[].forEach.call(document.querySelectorAll('.rd'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r)r.doc=i.value.trim();});[].forEach.call(document.querySelectorAll('.rp'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r)r.party=i.value.trim();});var who=(document.getElementById('who').value||'').trim();var ps=document.getElementById('pst');
 if(who.length<2){ps.innerHTML='<div class="msg err">Enter your name first.</div>';return;}
 if(np.some(function(r){return !r.shift;})){ps.innerHTML='<div class="msg err">Some entries have no Day/Night shift (red ?). Pick D or N on those rows first.</div>';return;}
 try{localStorage.setItem('wkmname',who);}catch(e){}
 var mm=np.filter(function(r){return r.mismatch;}).length,dt=document.getElementById('dt').value;
 if(!confirm('Post '+np.length+' entries for '+(dt?dt.split(',').map(nice).join(', '):'all dates')+' to the Inventory Statement?'+(mm?' WARNING: '+mm+' row(s) do not match the balance written on the sheet.':'')))return;
 var b=document.getElementById('pb');b.disabled=true;ps.innerHTML='<div class="msg wait">Posting… do not close this page.</div>';
 var ord=document.getElementById('ord').value;
 google.script.run.withSuccessHandler(function(r){b.disabled=false;if(!r||r.error){ps.innerHTML='<div class="msg err">'+esc((r&&r.error)||'Posting failed')+'</div>';return;}
   var errs=r.errors||[];np.forEach(function(x){if(!errs.some(function(e){return e.indexOf('WKM-'+x.item+' no tab')===0;}))x.posted=true;});
   show(window.LASTROWS);msg('✅ Posted '+r.ok+' entr'+(r.ok===1?'y':'ies')+' to the ledger.'+(errs.length?' Note: '+esc(errs.join(', ')):''),'wait');})
  .withFailureHandler(function(e){b.disabled=false;ps.innerHTML='<div class="msg err">Error: '+esc(e.message||e)+'</div>';}).stockPost(document.getElementById('pin').value.trim(),np,who,ord);}

document.getElementById('pin').addEventListener('input',function(){if(this.value.trim().length>=4&&!document.getElementById('vInv').classList.contains('hide'))loadInv(false);});
</script></body></html>
