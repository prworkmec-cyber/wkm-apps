<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WKM Stock Check</title>
<style>
:root{--acc:#b35c00;--bg:#f6f4f1;--card:#fff;--ink:#222;--mut:#777;--ok:#2e7d32;--bad:#c62828}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}
select,input[type=date],input[type=text]{width:100%;font-size:16px;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff}
input[type=password],input[type=tel]{width:100%;font-size:20px;padding:10px;border:1px solid #ccc;border-radius:8px;letter-spacing:4px}
.pick{display:block;width:100%;padding:16px;border:2px dashed var(--acc);border-radius:10px;text-align:center;color:var(--acc);font-weight:bold;font-size:16px;cursor:pointer}
.pick input{display:none}
.fn{font-size:12px;color:var(--mut);margin-top:6px;text-align:center;word-break:break-all}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:17px;font-weight:bold;margin-top:12px}
button:disabled{opacity:.5}
.msg{padding:10px;border-radius:8px;font-size:14px;margin-top:10px}.err{background:#fdecea;color:var(--bad)}.wait{background:#fff4e5;color:#8a4a00}
.grp{font-weight:bold;color:#8a4a00;background:#fdf1e3;padding:8px 10px;border-radius:8px;margin:14px 0 6px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
th{font-size:12px;color:var(--mut);text-align:left;padding:8px;border-bottom:1px solid #eee}
td{padding:9px 8px;border-bottom:1px solid #f1f1f1;font-size:16px;vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums}.minus{color:var(--bad)}.plus{color:var(--ok)}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;margin-top:3px}
.posted{background:#e8f5e9;color:var(--ok)}.new{background:#fff4e5;color:#8a4a00}
.warn{color:var(--bad);font-size:12px}.nm{font-size:11px;color:var(--mut)}
</style></head><body><div class="wrap">
<h1>WKM Stock Check</h1><div class="sub">Upload the daily stock sheet photo, check the balance left for each item, then post the new entries.</div>
<div class="card"><label>PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="Enter PIN"></div>
<div class="card"><label>Project / order</label><select id="ord"><option value="">Enter the PIN to load orders…</option></select></div>
<div class="card"><label>Entry date</label><input id="dt" type="date"></div>
<div class="card"><label class="pick">📷 Take / upload photo<input id="file" type="file" accept="image/*"></label><div id="fn" class="fn"></div>
<button id="go" onclick="go()">Check balances</button><div id="st"></div></div>
<div id="out"></div></div>
<script>
/* Adapter: this page is hosted on GitHub Pages and talks to the WKM Stock Check Apps Script
   backend (JSON API, doPost) in the background - no Google sign-in involved. The PIN, the AI key
   and all data stay in the Apps Script project; nothing secret is in this file. */
var WKM_API='https://script.google.com/macros/s/AKfycbyVPC3VXQXhbW89bu8CsoX6TVLsGlfdFsb6hiDBAkdbwfJMY3l52yVDEpwOTBoTWqYB/exec';
function wkmCall(action,args,ok,fail){var b={action:action};
 if(action==='orders'){b.pin=args[0];}
 else if(action==='check'){b.pin=args[0];b.b64=args[1];b.mime=args[2];b.order=args[3];}
 else if(action==='post'){b.pin=args[0];b.rows=args[1];b.name=args[2];b.order=args[3];}
 fetch(WKM_API,{method:'POST',body:JSON.stringify(b),redirect:'follow'})
  .then(function(r){if(!r.ok)throw new Error('Server error '+r.status);return r.json();})
  .then(function(j){if(ok)ok(j);})
  .catch(function(e){if(fail)fail(e);});}
function wkmRunner(){var ok=null,fail=null,api={
 withSuccessHandler:function(f){ok=f;return api;},
 withFailureHandler:function(f){fail=f;return api;},
 stockOrders:function(){wkmCall('orders',arguments,ok,fail);},
 stockCheck:function(){wkmCall('check',arguments,ok,fail);},
 stockPost:function(){wkmCall('post',arguments,ok,fail);}};return api;}
var google={script:{}};Object.defineProperty(google.script,'run',{get:wkmRunner});
</script>
<script>
try{localStorage.removeItem('wkmpin');}catch(e){}   // PIN is never stored on the phone (old saved PINs are wiped)
setTimeout(function(){if(typeof loadOrders==='function')loadOrders();},0);
var ORDLOADED='';
function loadOrders(){var pin=document.getElementById('pin').value.trim();if(pin.length<4||pin===ORDLOADED)return;ORDLOADED=pin;var s=document.getElementById('ord');s.innerHTML='<option value="">Loading orders…</option>';
 google.script.run.withSuccessHandler(function(r){if(!r||r.error){ORDLOADED='';s.innerHTML='<option value="">'+esc((r&&r.error)||'Could not load orders')+'</option>';return;}
  var o='<option value="">(no order)</option>',g=null;(r.orders||[]).forEach(function(x){if(x.group!==g){if(g!==null)o+='</optgroup>';g=x.group;o+='<optgroup label="'+esc(g)+'">';}o+='<option value="'+esc(x.orderNo)+'">'+esc(x.orderNo)+(x.project?' – '+esc(x.project):'')+'</option>';});if(g!==null)o+='</optgroup>';s.innerHTML=o;
  try{var so=localStorage.getItem('wkmord');if(so&&[].some.call(s.options,function(op){return op.value===so;}))s.value=so;else if(r.orders&&r.orders.length===1)s.value=r.orders[0].orderNo;}catch(e){}})
 .withFailureHandler(function(){ORDLOADED='';s.innerHTML='<option value="">Could not load orders</option>';}).stockOrders(pin);}
document.getElementById('pin').addEventListener('input',loadOrders);document.getElementById('pin').addEventListener('change',loadOrders);
document.getElementById('ord').onchange=function(){try{localStorage.setItem('wkmord',this.value);}catch(e){}};
(function(){var d=new Date();document.getElementById('dt').value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);})();
document.getElementById('dt').onchange=function(){if(window.LASTROWS)show(window.LASTROWS);};
document.getElementById('file').onchange=function(){var f=this.files[0];document.getElementById('fn').textContent=f?f.name:'';};
function msg(t,c){document.getElementById('st').innerHTML=t?'<div class="msg '+c+'">'+t+'</div>':'';}
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
function nice(d){var m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return d||'No date';return +m[3]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]+' '+m[1];}
function shrink(file,cb){var img=new Image(),url=URL.createObjectURL(file);img.onload=function(){var max=2000,w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',0.88).split(',')[1]);};img.onerror=function(){cb(null);};img.src=url;}
function go(){var pin=document.getElementById('pin').value.trim(),f=document.getElementById('file').files[0];
 if(!pin){msg('Enter the PIN.','err');return;} if(!f){msg('Choose a photo first.','err');return;}

 var b=document.getElementById('go');b.disabled=true;document.getElementById('out').innerHTML='';msg('Reading the sheet… this takes about 20–40 seconds.','wait');
 shrink(f,function(b64){ if(!b64){b.disabled=false;msg('Could not open that photo.','err');return;}
  google.script.run.withSuccessHandler(function(r){b.disabled=false;if(!r||r.error){msg(esc((r&&r.error)||'Something went wrong.'),'err');return;}msg('','');show(r.rows||[]);})
   .withFailureHandler(function(e){b.disabled=false;msg('Error: '+esc(e.message||e),'err');}).stockCheck(pin,b64,'image/jpeg',document.getElementById('ord').value);});}
function show(all){[].forEach.call(document.querySelectorAll('.rsh'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r&&i.value){r.shift=i.value;r._shAssumed=false;}});[].forEach.call(document.querySelectorAll('.rn'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r)r.note=i.value.trim();});window.LASTROWS=all;var sel=document.getElementById('dt').value;var shf='';var rows=all.filter(function(r){if(sel&&r.date!==sel)return false;if(!r.shift||r._shAssumed){r.shift=shf;r._shAssumed=true;}if(shf&&r.shift!==shf)return false;return true;});
 if(!rows.length&&all.length){var ds=[];all.forEach(function(r){if(r.date&&ds.indexOf(r.date)<0)ds.push(r.date);});document.getElementById('out').innerHTML='<div class="card">No entries for <b>'+esc(nice(sel))+(shf?' · '+(shf==='N'?'Night':'Day')+' shift':'')+'</b> on this photo.'+(ds.length?'<br>Dates on the photo: '+ds.map(nice).join(', ')+'. Change the date above to see them.':'')+'</div>';return;}
var os=document.getElementById('ord'),ot=os&&os.value?os.options[os.selectedIndex].text:'(no order)';document.getElementById('out').innerHTML='';var pre='<div class="sub" style="margin:4px 0 0">Project: <b>'+esc(ot)+'</b></div>';
 setTimeout(function(){var o=document.getElementById('out');o.innerHTML=pre+o.innerHTML;},0);if(!rows.length){document.getElementById('out').innerHTML='<div class="card">No rows found on the photo.</div>';return;}
 var h='',g=null;rows.forEach(function(r){var k=r.date+'|'+r.shift;if(k!==g){if(g!==null)h+='</table>';g=k;h+='<div class="grp">'+nice(r.date)+' · '+(r.shift==='N'?'Night shift':r.shift==='D'?'Day shift':'Shift not read')+'</div><table><tr><th>WKM</th><th style="text-align:center">Shift</th><th style="text-align:right">+ / −</th><th style="text-align:right">Balance left</th></tr>';}
  var cls=String(r.change).charAt(0)==='-'?'minus':'plus';
  var k=all.indexOf(r),sv=r.shift||'';h+='<tr><td><b>'+esc(r.item)+'</b><div class="nm">'+esc(r.name)+'</div></td><td style="text-align:center">'+((!r.posted&&!r.error)?'<select class="rsh" data-k="'+k+'" style="width:58px;padding:6px;font-size:15px'+(sv?'':';border:2px solid #c62828')+'"><option value=""'+(sv?'':' selected')+'>?</option><option value="D"'+(sv==='D'?' selected':'')+'>D</option><option value="N"'+(sv==='N'?' selected':'')+'>N</option></select>':'<b>'+(sv||'?')+'</b>')+'</td><td class="n '+cls+'">'+esc(String(r.change).replace('-','−'))+'</td><td class="n">';
  if(r.error){h+='<span class="warn">'+esc(r.error)+'</span>';}
  else{h+='<b>'+esc(r.balance)+'</b> <span class="nm">'+(r.unit==='KG'?'kg':'pcs')+'</span><br><span class="tag '+(r.posted?'posted">posted ✓':'new">not posted yet')+'</span>'+(r.mismatch?'<div class="warn">⚠ sheet says '+esc(r.sheet)+'</div>':'');}
  h+='</td></tr>';if(!r.posted&&!r.error&&(r.add||r.minus))h+='<tr><td colspan="4" style="padding-top:0"><input class="rn" type="text" data-k="'+all.indexOf(r)+'" placeholder="Note (optional)" value="'+esc(r.note||'')+'"></td></tr>';});
 h+='</table>';
 var np=rows.filter(function(r){return !r.posted&&!r.error&&(r.add||r.minus);});window.TOPOST=np;
 if(np.length){var nm='';try{nm=localStorage.getItem('wkmname')||'';}catch(e){}
  h+='<div class="card" style="margin-top:12px"><label>Your name (needed to post)</label><input id="who" type="text" autocomplete="name" value="'+esc(nm)+'">'
   +'<button id="pb" onclick="post()">Post '+np.length+' new entr'+(np.length>1?'ies':'y')+' to ledger</button><div id="pst"></div></div>';}
 document.getElementById('out').innerHTML=h;}
function post(){var np=window.TOPOST||[];if(!np.length)return;[].forEach.call(document.querySelectorAll('.rsh'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r){r.shift=i.value;r._shAssumed=false;}});[].forEach.call(document.querySelectorAll('.rn'),function(i){var r=(window.LASTROWS||[])[+i.dataset.k];if(r)r.note=i.value.trim();});var who=(document.getElementById('who').value||'').trim();var ps=document.getElementById('pst');
 if(who.length<2){ps.innerHTML='<div class="msg err">Enter your name first.</div>';return;}
 if(np.some(function(r){return !r.shift;})){ps.innerHTML='<div class="msg err">Some entries have no Day/Night shift (red ?). Pick D or N on those rows first.</div>';return;}
 try{localStorage.setItem('wkmname',who);}catch(e){}
 var mm=np.filter(function(r){return r.mismatch;}).length,dt=document.getElementById('dt').value;
 if(!confirm('Post '+np.length+' entries for '+nice(dt)+' to the Inventory Statement?'+(mm?' WARNING: '+mm+' row(s) do not match the balance written on the sheet.':'')))return;
 var b=document.getElementById('pb');b.disabled=true;ps.innerHTML='<div class="msg wait">Posting… do not close this page.</div>';
 var ord=document.getElementById('ord').value;
 google.script.run.withSuccessHandler(function(r){b.disabled=false;if(!r||r.error){ps.innerHTML='<div class="msg err">'+esc((r&&r.error)||'Posting failed')+'</div>';return;}
   var errs=r.errors||[];np.forEach(function(x){if(!errs.some(function(e){return e.indexOf('WKM-'+x.item+' no tab')===0;}))x.posted=true;});
   show(window.LASTROWS);msg('✅ Posted '+r.ok+' entr'+(r.ok===1?'y':'ies')+' to the ledger.'+(errs.length?' Note: '+esc(errs.join(', ')):''),'wait');})
  .withFailureHandler(function(e){b.disabled=false;ps.innerHTML='<div class="msg err">Error: '+esc(e.message||e)+'</div>';}).stockPost(document.getElementById('pin').value.trim(),np,who,ord);}

</script></body></html>
